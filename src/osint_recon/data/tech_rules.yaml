# Technology fingerprints (a small Wappalyzer-style rule set).
#
# Each rule may use any of these matchers (Python regular expressions, case-insensitive):
#   headers: {Header-Name: regex}   matched against the response header value
#   cookies: [regex]                matched against cookie NAMES (full match)
#   meta:    regex                  matched against <meta name="generator" content="...">
#   scripts: regex                  matched against <script src="..."> URLs
#   html:    regex                  searched in the page HTML
# The first capture group, if any, is taken as the version.

- name: nginx
  category: Web server
  headers: {Server: 'nginx(?:/([\d.]+))?'}
- name: Apache HTTP Server
  category: Web server
  headers: {Server: 'Apache(?:/([\d.]+))?'}
- name: Microsoft IIS
  category: Web server
  headers: {Server: 'Microsoft-IIS(?:/([\d.]+))?'}
- name: LiteSpeed
  category: Web server
  headers: {Server: 'LiteSpeed'}
- name: Cloudflare
  category: CDN / proxy
  headers: {Server: 'cloudflare', CF-RAY: '.+'}
- name: Varnish
  category: CDN / proxy
  headers: {Via: 'varnish', X-Varnish: '.+'}
- name: Amazon CloudFront
  category: CDN / proxy
  headers: {Via: 'CloudFront', X-Amz-Cf-Id: '.+'}
- name: PHP
  category: Language
  headers: {X-Powered-By: 'PHP(?:/([\d.]+))?'}
  cookies: ['PHPSESSID']
- name: ASP.NET
  category: Framework
  headers: {X-Powered-By: 'ASP\.NET', X-AspNet-Version: '([\d.]+)'}
  cookies: ['ASP\.NET_SessionId', '\.ASPXAUTH']
- name: Express
  category: Framework
  headers: {X-Powered-By: '^Express$'}
- name: Next.js
  category: Framework
  headers: {X-Powered-By: 'Next\.js(?: ([\d.]+))?'}
  html: '__NEXT_DATA__'
- name: Java (Servlet)
  category: Language
  cookies: ['JSESSIONID']
- name: WordPress
  category: CMS
  meta: 'WordPress ?([\d.]+)?'
  html: '/wp-(?:content|includes)/'
- name: Drupal
  category: CMS
  meta: 'Drupal ?(\d+)?'
  headers: {X-Generator: 'Drupal ?(\d+)?', X-Drupal-Cache: '.+'}
- name: Joomla
  category: CMS
  meta: 'Joomla!? ?([\d.]+)?'
- name: Shopify
  category: E-commerce
  headers: {X-ShopId: '.+'}
  html: 'cdn\.shopify\.com'
- name: jQuery
  category: JavaScript library
  scripts: 'jquery[.-]?((?:\d+\.)+\d+)?(?:\.min)?\.js'
- name: Bootstrap
  category: UI framework
  scripts: 'bootstrap(?:[.-]((?:\d+\.)+\d+))?(?:\.bundle)?(?:\.min)?\.js'
- name: React
  category: JavaScript framework
  html: 'data-reactroot|react(?:-dom)?(?:\.production)?(?:\.min)?\.js'
- name: Google Tag Manager
  category: Analytics
  scripts: 'googletagmanager\.com'
- name: Google Analytics
  category: Analytics
  scripts: 'google-analytics\.com|gtag/js'
