[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "osint-recon"
dynamic = ["version"]  # single source of truth: src/osint_recon/__init__.py
description = "Asynchronous OSINT aggregator for domains and organisations: subdomains, emails, technologies, document metadata and known breaches, consolidated into Markdown and JSON reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SpromBash" }]
keywords = ["osint", "recon", "reconnaissance", "subdomains", "hibp", "security", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.0",  # only for 'twine check'; never used to upload here
]

[project.scripts]
osint-recon = "osint_recon.cli:app"

[project.urls]
Homepage = "https://github.com/SPROMbash/osint-recon"
Issues = "https://github.com/SPROMbash/osint-recon/issues"

[tool.hatch.version]
path = "src/osint_recon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_recon"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CLAUDE.md", "pyproject.toml"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
